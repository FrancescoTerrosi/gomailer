# gomailer system user/group — read by systemd-sysusers(8).
#
# Install to /etc/sysusers.d/gomailer.conf (local) or
# /usr/lib/sysusers.d/gomailer.conf (packages), then run `systemd-sysusers`
# (idempotent: it creates the account only if it is missing). This is what
# makes the unit's User=/Group= work without a manual useradd.
#
# The daemon runs as this user. The store and the control socket are 0600
# and owner-only, so scheduling clients must run as this same user too:
#   sudo -u gomailer env PEC_PASSWORD=... gomailer -in 2m ...
#
# Home is informational: systemd's StateDirectory= (see gomailer.service)
# creates and owns /var/lib/gomailer at service start; sysusers does not
# create home directories.
#
# type name      id  description                       home              shell
g      gomailer  -
u      gomailer  -   "gomailer PEC scheduling daemon" /var/lib/gomailer /usr/sbin/nologin
